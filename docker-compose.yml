services:
  gordodj:
    build: .
    container_name: gordodj-bot
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    volumes:
      # Persistent data dir, currently just cookies.txt (optional, avoids
      # YouTube's bot-check; gitignored, it's a secret). Mounting a DIRECTORY
      # here — not the file itself — is deliberate: a path that IS the mount
      # point can never be replaced with a plain file from inside the
      # container (rmdir/unlink on an active mount throws EBUSY,
      # unconditionally), which broke the cookie upload web UI when it tried
      # to write cookies.txt directly at a bind-mounted /app/cookies.txt. A
      # mounted directory has no such problem — cookies.txt lives as a normal,
      # freely-writable file inside it. Writable (no :ro) so the web UI
      # (web/cookieServer.js) can save it in place; bind-mounted so it
      # persists on the host across container restarts.
      # If writes fail with EACCES (not EISDIR) instead: the host ./data
      # directory was auto-created root-owned on first run — fix with
      # `chown 1001:1001 ./data` (or `chmod 777 ./data`) on the host.
      - ./data:/app/data
    ports:
      # Cookie upload web UI — only actually listens if COOKIE_SERVER_PORT is
      # set in .env; otherwise this maps to nothing and is harmless. See the
      # README for setup and the auto-generated access token.
      - "${COOKIE_SERVER_PORT:-8080}:${COOKIE_SERVER_PORT:-8080}"
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
