services:
  gordodj:
    build: .
    container_name: gordodj-bot
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
