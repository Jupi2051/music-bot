services:
  gordodj:
    build: .
    container_name: gordodj-bot
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    volumes:
      # YouTube cookies (optional): avoids YouTube's bot-check. File is
      # gitignored (it's a secret). Writable (no :ro) so the cookie upload web
      # UI (web/cookieServer.js) can update it in place, bind-mounted so
      # changes persist on the host across container restarts.
      # IMPORTANT: run `touch cookies.txt` on the host before the first
      # `docker compose up` — otherwise Docker auto-creates the mount target
      # as a root-owned stub the nodejs user (uid 1001) can't write to.
      - ./cookies.txt:/app/cookies.txt
    ports:
      # Cookie upload web UI — only actually listens if COOKIE_SERVER_PORT is
      # set in .env; otherwise this maps to nothing and is harmless. See the
      # README for setup and the auto-generated access token.
      - "${COOKIE_SERVER_PORT:-8080}:${COOKIE_SERVER_PORT:-8080}"
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
